name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - name: Execution manager recovery evidence
        run: >-
          python3 scripts/run_linux_recovery_evidence.py
          --manager ${{ github.workspace }}/build/vecu_execution_manager
          --config-dir ${{ github.workspace }}/config
          --output ${{ github.workspace }}/artifacts/linux-recovery-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-recovery-evidence
          path: artifacts/linux-recovery-evidence.json
      - name: Checkout SDV communication project
        uses: actions/checkout@v4
        with:
          repository: KristenYue/sdv-communication-integration-lab
          path: sdv-project
      - name: Build real SDV vehicle service
        run: |
          cmake -S sdv-project -B sdv-build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build sdv-build --target sdv_someip_vehicle_server sdv_someip_vehicle_client -j2
      - name: Real SDV service recovery integration
        run: >-
          python3 scripts/run_sdv_service_integration.py
          --manager ${{ github.workspace }}/build/vecu_execution_manager
          --adapter ${{ github.workspace }}/build/vecu_managed_process_adapter
          --sdv-server ${{ github.workspace }}/sdv-build/sdv_someip_vehicle_server
          --sdv-client ${{ github.workspace }}/sdv-build/sdv_someip_vehicle_client
          --output ${{ github.workspace }}/artifacts/linux-sdv-integration-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-sdv-integration-evidence
          path: artifacts/linux-sdv-integration-evidence.json

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: .\scripts\build_windows.ps1

  arm64-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 and Buildroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu bc bison build-essential cpio file flex \
            libelf-dev libncurses-dev libssl-dev rsync unzip wget
      - name: Cross-compile static ARM64 runtime
        run: |
          cmake -S . -B arm64-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/aarch64-linux-gnu.cmake
          cmake --build arm64-build --target vecu_execution_manager vecu_faultable_service -j2
          file arm64-build/vecu_execution_manager arm64-build/vecu_faultable_service
      - name: Checkout pinned Buildroot stable release
        run: |
          git clone --depth 1 --branch 2026.08.2 https://gitlab.com/buildroot.org/buildroot.git buildroot-src
          test "$(git -C buildroot-src rev-parse HEAD)" = "cd8011d7c9965e1bcfc9c18d4272943f9c333b68"
      - uses: actions/cache@v4
        with:
          path: |
            buildroot-dl
            ~/.buildroot-ccache
          key: buildroot-2026.08.2-aarch64-virt-bootlin-v1
      - name: Prepare ARM64 root filesystem overlay
        run: |
          bash scripts/prepare_arm64_rootfs_overlay.sh \
            buildroot/overlay arm64-build buildroot-work-overlay
      - name: Build minimal ARM64 Linux image
        run: |
          make -C buildroot-src O=${{ github.workspace }}/buildroot-output qemu_aarch64_virt_defconfig
          buildroot-src/utils/config --file buildroot-output/.config \
            --enable BR2_TOOLCHAIN_EXTERNAL \
            --enable BR2_TOOLCHAIN_EXTERNAL_BOOTLIN \
            --enable BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_AARCH64_GLIBC_STABLE \
            --enable BR2_TOOLCHAIN_EXTERNAL_DOWNLOAD \
            --set-str BR2_ROOTFS_OVERLAY "${{ github.workspace }}/buildroot-work-overlay"
          make -C buildroot-src O=${{ github.workspace }}/buildroot-output olddefconfig
          make -C buildroot-src O=${{ github.workspace }}/buildroot-output \
            BR2_DL_DIR=${{ github.workspace }}/buildroot-dl \
            BR2_CCACHE_DIR=$HOME/.buildroot-ccache -j2
      - name: Publish reproducible ARM64 boot images
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm64-images
          path: |
            buildroot-output/images/Image
            buildroot-output/images/rootfs.ext2

  arm64-vecu:
    needs: arm64-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Download reproducible ARM64 boot images
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm64-images
          path: arm64-images
      - name: Boot QEMU ARM64 and collect recovery evidence
        run: >-
          python3 scripts/run_qemu_arm64_evidence.py
          --images ${{ github.workspace }}/arm64-images
          --output ${{ github.workspace }}/artifacts/qemu-arm64-recovery-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-arm64-recovery-evidence
          path: artifacts/qemu-arm64-recovery-evidence.json

